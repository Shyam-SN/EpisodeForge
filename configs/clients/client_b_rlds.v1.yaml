client: client_b
spec_version: v1
dataset_name: panda_tabletop_rlds
format: rlds
format_version: open_x_v0.1

selection:
  sources:
    - generated_mujoco
  tasks:
    - pick_place
    - push
    - stack
  require_success: true
  min_qa_verdict: PASS
  max_episodes: 1000
  balance_per_task: true

timing:
  target_fps: 10.0
  resampling_method_state: linear
  resampling_method_rotation: slerp
  resampling_method_action: zoh
  resampling_method_camera: nearest
  max_timestamp_error_ms: 50.0

cameras:
  front:
    target_key: image
    resolution: [224, 224]
    resize_mode: center_crop
    color_space: rgb
    dtype: uint8
    codec: jpeg
    quality: 90
    pixel_format: yuv420p

state:
  include_fields:
    - joint_positions
    - gripper_width
  order:
    - joint_positions
    - gripper_width
  units_length: m
  units_angle: rad
  target_key: state

action:
  representation: ee_delta_pose
  rotation_format: euler_xyz
  units_length: m
  units_angle: rad
  gripper_convention: zero_to_one
  gripper_inverted: false
  target_key: action

frames:
  target_base_frame: robot_base
  camera_convention: opencv
  handedness: right

trimming:
  trim_idle_start: true
  trim_idle_end: true
  velocity_threshold: 0.01
  padding_steps: 2

language:
  target_key: language_instruction
  paraphrase_augmentation: false

splits:
  train_ratio: 0.85
  val_ratio: 0.15
  test_ratio: 0.0
  split_by: episode
  stratify_by_task: true
  seed: 42
  leakage_check: true

statistics:
  compute_stats: true
  target_keys:
    - state
    - action
  metrics:
    - mean
    - std
    - min
    - max

packaging:
  sharding_max_episodes_per_shard: 500
  sharding_max_size_mb: 1000
  compression: none
  generate_datacard: true

delivery:
  bucket: robotics-data-lake
  prefix: client_b/rlds
  release_naming: "v{n}"
  checksum_algorithm: sha256
  manifest_format: both
  compression_for_upload: none

acceptance_criteria:
  max_loader_failure_rate: 0.0
  max_timestamp_error_ms: 50.0
  min_episodes_delivered_ratio: 0.95
  verify_stats_roundtrip: true
