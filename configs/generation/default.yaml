robot_model: franka_emika_panda
tasks:
  - pick_place
  - push
  - stack

total_episodes: 1000
control_rate_hz: 15.0
physics_rate_hz: 500.0
seed: 0
workers: 4
save_format: png_master

cameras:
  - name: front
    width: 640
    height: 480
    fps: 30.0
    fov: 45.0
    pos: [0.65, 0.0, 0.6]
    quat: [0.92388, 0.38268, 0.0, 0.0]
  - name: wrist
    width: 320
    height: 240
    fps: 30.0
    fov: 60.0
    pos: [0.05, 0.0, 0.05]
    quat: [1.0, 0.0, 0.0, 0.0]
  - name: side
    width: 640
    height: 480
    fps: 30.0
    fov: 50.0
    pos: [0.0, 0.75, 0.5]
    quat: [0.7071, 0.0, 0.7071, 0.0]

randomization:
  table_texture_jitter: true
  light_intensity_range: [0.7, 1.3]
  object_color_jitter: true
  object_pos_noise_m: 0.03
  object_rot_noise_rad: 0.35
  distractor_count_range: [0, 2]
  friction_range: [0.7, 1.3]
  mass_range: [0.8, 1.2]

imperfections:
  failed_grasp_rate: 0.08
  timeout_rate: 0.03
  nan_glitch_rate: 0.02
  duplicate_episode_rate: 0.02
  idle_padding_rate: 0.05

