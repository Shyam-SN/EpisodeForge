version: "3.8"

services:
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: episodeforge-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  createbuckets:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/robotics-data-lake;
      /usr/bin/mc anonymous set download myminio/robotics-data-lake;
      exit 0;
      "

  forge-demo:
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      bash -c "forge generate --episodes 2 --workers 1 &&
               forge run --spec configs/clients/client_a_lerobot.v1.yaml &&
               forge spec lint configs/clients/client_a_lerobot.v1.yaml"
    volumes:
      - ./data:/app/data

volumes:
  minio_data:
