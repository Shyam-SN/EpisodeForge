[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episodeforge"
version = "0.1.0"
description = "Robotics Data Pipeline: Generate -> Validate -> Transform to Client Schemas -> Deliver at Scale"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "EpisodeForge Authors" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "jsonschema>=4.21.0",
    "numpy>=1.26.0,<2.1.0",
    "scipy>=1.13.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "duckdb>=0.10.0",
    "h5py>=3.10.0",
    "av>=12.0.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "boto3>=1.34.0",
    "pillow>=10.2.0",
    "mujoco>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "hypothesis>=6.100.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML",
    "types-requests",
    "moto[s3]>=5.0.0",
]
dashboard = [
    "streamlit>=1.33.0",
    "plotly>=5.20.0",
]
ray = [
    "ray>=2.20.0",
]

[project.scripts]
forge = "episodeforge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/episodeforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
