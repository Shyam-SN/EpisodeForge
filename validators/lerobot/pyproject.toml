[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episodeforge-validator-lerobot"
version = "0.1.0"
description = "Isolated validator for LeRobot dataset packages"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
official = [
    "torch>=2.2.0",
    "lerobot>=0.3.0",
    "av>=12.0.0",
]

