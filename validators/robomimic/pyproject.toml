[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "episodeforge-validator-robomimic"
version = "0.1.0"
description = "Isolated validator for robomimic HDF5 datasets"
requires-python = ">=3.11"
dependencies = [
    "h5py>=3.10.0",
    "numpy>=1.26.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
official = [
    "robomimic>=0.3.0",
]

